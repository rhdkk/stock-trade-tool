{% extends "base.html" %}

{% block extra_head %}
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
{% endblock %}

{% block content %}
<div x-data="analysisPage()" class="space-y-8">
    <h1 class="text-4xl font-bold">📊 Stock Analysis</h1>
    
    <!-- Enhanced Search Bar -->
    <div class="bg-gradient-to-r from-gray-800 to-gray-900 rounded-lg p-6 border border-blue-500 border-opacity-50">
        <label class="block text-sm font-semibold text-gray-300 mb-3">Enter Stock Ticker</label>
        <div class="flex gap-3">
            <input 
                x-model="ticker" 
                placeholder="e.g., AAPL, MSFT, BBCA.JK, 0001.HK" 
                class="flex-1 px-4 py-3 bg-gray-700 text-white placeholder-gray-400 rounded-lg border-2 border-gray-600 focus:border-blue-500 focus:outline-none transition font-semibold text-base"
                @keyup.enter="analyzeStock()"
            >
            <button 
                @click="analyzeStock()" 
                class="px-8 py-3 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold rounded-lg hover:from-blue-700 hover:to-blue-800 transition disabled:opacity-50 disabled:cursor-not-allowed"
                :disabled="loading"
            >
                <span x-show="!loading">Analyze</span>
                <span x-show="loading" class="inline-flex items-center">
                    <svg class="animate-spin h-5 w-5 mr-2" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Analyzing...
                </span>
            </button>
        </div>
    </div>
    
    <!-- Error Message -->
    <div x-show="error" class="card bg-red-900 border-red-700 border-2">
        <div class="flex items-start">
            <span class="text-2xl mr-3">⚠️</span>
            <p class="text-white font-semibold" x-text="error"></p>
        </div>
    </div>
    
    <!-- Results -->
    <template x-if="data">
        <div class="space-y-6">
            <!-- Signal Card -->
            <div class="card border-2" :class="getSignalClass(data.signal)">
                <div class="grid grid-cols-3 gap-4 text-center">
                    <div>
                        <div class="text-6xl mb-2">
                            <span x-text="getSignalEmoji(data.signal)"></span>
                        </div>
                        <div class="text-2xl font-bold" :class="getSignalColor(data.signal)">
                            <span x-text="data.signal"></span>
                        </div>
                        <div class="text-gray-400 text-sm mt-2">Trading Signal</div>
                    </div>
                    <div>
                        <div class="text-5xl font-bold text-blue-400">
                            <span x-text="data.confidence.toFixed(0)"></span>%
                        </div>
                        <div class="text-gray-400 text-sm mt-2">Confidence</div>
                    </div>
                    <div>
                        <div class="text-4xl font-bold text-yellow-400">
                            <span x-text="formatPrice(data.indicators.price)"></span>
                        </div>
                        <div class="text-gray-400 text-sm mt-2">Current Price</div>
                    </div>
                </div>
            </div>
            
            <!-- Charts Container -->
            <div class="space-y-4">
                <!-- Price Chart -->
                <div class="card">
                    <h3 class="text-lg font-bold mb-4 text-white">Price Chart with EMAs</h3>
                    <div class="w-full h-96 bg-gray-900 rounded-lg p-2">
                        <canvas id="priceChart" style="display: block;"></canvas>
                    </div>
                </div>
                
                <!-- Volume Chart -->
                <div class="card">
                    <h3 class="text-lg font-bold mb-4 text-white">Trading Volume (20-day Average)</h3>
                    <div class="w-full h-48 bg-gray-900 rounded-lg p-2">
                        <canvas id="volumeChart" style="display: block;"></canvas>
                    </div>
                </div>
            </div>
            
            <!-- Tabs -->
            <div class="card">
                <div class="flex border-b border-gray-700 mb-6 space-x-2">
                    <button 
                        @click="activeTab = 'analysis'"
                        :class="activeTab === 'analysis' ? 'text-blue-400 border-b-2 border-blue-400 bg-gray-700 bg-opacity-30' : 'text-gray-400 hover:text-gray-300'"
                        class="pb-3 px-4 font-bold transition rounded-t"
                    >
                        📈 Technical Analysis
                    </button>
                    <button 
                        @click="activeTab = 'indicators'"
                        :class="activeTab === 'indicators' ? 'text-blue-400 border-b-2 border-blue-400 bg-gray-700 bg-opacity-30' : 'text-gray-400 hover:text-gray-300'"
                        class="pb-3 px-4 font-bold transition rounded-t"
                    >
                        📊 Indicators
                    </button>
                    <button 
                        @click="activeTab = 'fundamentals'"
                        :class="activeTab === 'fundamentals' ? 'text-blue-400 border-b-2 border-blue-400 bg-gray-700 bg-opacity-30' : 'text-gray-400 hover:text-gray-300'"
                        class="pb-3 px-4 font-bold transition rounded-t"
                    >
                        🏢 Fundamentals
                    </button>
                </div>
                
                <!-- Analysis Tab -->
                <div x-show="activeTab === 'analysis'" class="space-y-3">
                    <template x-for="(value, key) in data.details" :key="key">
                        <div class="flex justify-between items-center py-3 border-b border-gray-700 last:border-b-0 hover:bg-gray-700 hover:bg-opacity-20 px-2 rounded transition">
                            <span class="font-semibold text-blue-300" x-text="key"></span>
                            <span class="text-right text-gray-200" x-html="value"></span>
                        </div>
                    </template>
                </div>
                
                <!-- Indicators Tab -->
                <div x-show="activeTab === 'indicators'" class="space-y-3">
                    <div class="flex justify-between items-center py-3 border-b border-gray-700 hover:bg-gray-700 hover:bg-opacity-20 px-2 rounded transition">
                        <span class="font-semibold">Close Price</span>
                        <span class="text-yellow-300 font-bold" x-text="formatPrice(data.indicators.price)"></span>
                    </div>
                    <div class="flex justify-between items-center py-3 border-b border-gray-700 hover:bg-gray-700 hover:bg-opacity-20 px-2 rounded transition">
                        <span class="font-semibold">Volume</span>
                        <span class="text-gray-300" x-text="formatVolume(data.indicators.volume)"></span>
                    </div>
                    <div class="flex justify-between items-center py-3 border-b border-gray-700 hover:bg-gray-700 hover:bg-opacity-20 px-2 rounded transition">
                        <span class="font-semibold text-green-300">EMA 9 (Fast)</span>
                        <span class="text-green-300 font-bold" x-text="formatPrice(data.indicators.ema_9)"></span>
                    </div>
                    <div class="flex justify-between items-center py-3 border-b border-gray-700 hover:bg-gray-700 hover:bg-opacity-20 px-2 rounded transition">
                        <span class="font-semibold text-yellow-300">EMA 21 (Mid)</span>
                        <span class="text-yellow-300 font-bold" x-text="formatPrice(data.indicators.ema_21)"></span>
                    </div>
                    <div class="flex justify-between items-center py-3 border-b border-gray-700 hover:bg-gray-700 hover:bg-opacity-20 px-2 rounded transition">
                        <span class="font-semibold text-orange-300">EMA 55 (Slow)</span>
                        <span class="text-orange-300 font-bold" x-text="formatPrice(data.indicators.ema_55)"></span>
                    </div>
                    <div class="flex justify-between items-center py-3 border-b border-gray-700 hover:bg-gray-700 hover:bg-opacity-20 px-2 rounded transition">
                        <span class="font-semibold">RSI (14)</span>
                        <span class="text-blue-300 font-bold" x-text="(data.indicators.rsi || 0).toFixed(2)"></span>
                    </div>
                    <div class="flex justify-between items-center py-3 border-b border-gray-700 hover:bg-gray-700 hover:bg-opacity-20 px-2 rounded transition">
                        <span class="font-semibold">MACD</span>
                        <span class="text-gray-300" x-text="(data.indicators.macd || 0).toFixed(6)"></span>
                    </div>
                    <div class="flex justify-between items-center py-3 border-b border-gray-700 hover:bg-gray-700 hover:bg-opacity-20 px-2 rounded transition">
                        <span class="font-semibold">Stochastic %K</span>
                        <span class="text-purple-300" x-text="(data.indicators.stoch_k || 0).toFixed(2)"></span>
                    </div>
                    <div class="flex justify-between items-center py-3 hover:bg-gray-700 hover:bg-opacity-20 px-2 rounded transition">
                        <span class="font-semibold">Bollinger Upper</span>
                        <span class="text-gray-300" x-text="formatPrice(data.indicators.bb_upper)"></span>
                    </div>
                </div>
                
                <!-- Fundamentals Tab -->
                <div x-show="activeTab === 'fundamentals'" class="space-y-3">
                    <template x-if="data.fundamentals">
                        <div>
                            <div class="flex justify-between items-center py-3 border-b border-gray-700 hover:bg-gray-700 hover:bg-opacity-20 px-2 rounded transition">
                                <span class="font-semibold">Company</span>
                                <span class="text-gray-300" x-text="data.fundamentals.name || 'N/A'"></span>
                            </div>
                            <div class="flex justify-between items-center py-3 border-b border-gray-700 hover:bg-gray-700 hover:bg-opacity-20 px-2 rounded transition">
                                <span class="font-semibold">Sector</span>
                                <span class="text-gray-300" x-text="data.fundamentals.sector || 'N/A'"></span>
                            </div>
                            <div class="flex justify-between items-center py-3 border-b border-gray-700 hover:bg-gray-700 hover:bg-opacity-20 px-2 rounded transition">
                                <span class="font-semibold">Industry</span>
                                <span class="text-gray-300" x-text="data.fundamentals.industry || 'N/A'"></span>
                            </div>
                            <div class="flex justify-between items-center py-3 border-b border-gray-700 hover:bg-gray-700 hover:bg-opacity-20 px-2 rounded transition">
                                <span class="font-semibold">P/E Ratio</span>
                                <span class="text-gray-300" x-text="data.fundamentals.pe_ratio || 'N/A'"></span>
                            </div>
                            <div class="flex justify-between items-center py-3 border-b border-gray-700 hover:bg-gray-700 hover:bg-opacity-20 px-2 rounded transition">
                                <span class="font-semibold">Market Cap</span>
                                <span class="text-gray-300" x-text="formatMarketCap(data.fundamentals.market_cap)"></span>
                            </div>
                            <div class="flex justify-between items-center py-3 border-b border-gray-700 hover:bg-gray-700 hover:bg-opacity-20 px-2 rounded transition">
                                <span class="font-semibold">52-Week High</span>
                                <span class="text-green-300" x-text="formatPrice(data.fundamentals['52_week_high'])"></span>
                            </div>
                            <div class="flex justify-between items-center py-3 hover:bg-gray-700 hover:bg-opacity-20 px-2 rounded transition">
                                <span class="font-semibold">52-Week Low</span>
                                <span class="text-red-300" x-text="formatPrice(data.fundamentals['52_week_low'])"></span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </template>
</div>
{% endblock %}
