<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Stock Technical Analyzer{% endblock %}</title>
    
    <!-- Tailwind CSS (CDN) - MUST BE FIRST -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#1e1e1e',
                        darker: '#0f0f0f',
                    }
                }
            }
        }
    </script>
    
    <!-- Alpine.js (CDN) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Chart.js (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Custom Styles -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .btn-primary {
            @apply px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition font-bold;
        }
        
        .btn-primary:disabled {
            @apply bg-gray-600 cursor-not-allowed;
        }
        
        .card {
            @apply bg-gray-800 rounded-lg p-6 border border-gray-700;
        }
        
        .input-field {
            @apply w-full px-4 py-2 bg-gray-700 text-white rounded border border-gray-600 focus:outline-none focus:border-blue-500 transition;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #2d2d2d;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #555555;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #777777;
        }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-900">
    <!-- Navigation -->
    <nav class="bg-gray-800 border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <h1 class="text-3xl font-bold text-blue-400">📈 Stock Analyzer</h1>
                <div class="flex space-x-6">
                    <a href="/" class="text-white hover:text-blue-400 font-semibold transition">Home</a>
                    <a href="/analysis" class="text-white hover:text-blue-400 font-semibold transition">Analysis</a>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 mt-16">
        <div class="max-w-7xl mx-auto px-4 py-8">
            <p class="text-gray-400 text-center">
                Stock Technical Analyzer v1.0 | Swing Trading Edition
            </p>
        </div>
    </footer>
</body>
</html>
